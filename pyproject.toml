[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "proofstack"
version = "0.1.0"
description = "Evidence-driven acceptance platform for AI-generated code changes"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "ProofStack Contributors" }]
keywords = ["code-analysis", "evidence", "security", "ai", "acceptance"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
]
dependencies = [
  "alembic>=1.13,<2",
  "argon2-cffi>=23.1,<26",
  "email-validator>=2.2,<3",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "networkx>=3.3,<4",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.5,<3",
  "PyJWT>=2.9,<3",
  "python-multipart>=0.0.12,<1",
  "PyYAML>=6.0,<7",
  "redis>=5.1,<6",
  "rich>=13.9,<14",
  "rq>=2.0,<3",
  "SQLAlchemy>=2.0.35,<3",
  "typer>=0.12,<1",
  "uvicorn[standard]>=0.31,<1",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.12,<2",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "pytest-cov>=5,<7",
  "ruff>=0.7,<1",
  "types-PyYAML>=6.0,<7",
]

[project.scripts]
proofstack = "proofstack_cli.main:app"
proofstack-worker = "proofstack_worker.main:main"

[tool.setuptools.packages.find]
where = [
  "apps/api",
  "apps/worker",
  "apps/cli",
  "packages/core",
  "packages/analyzers",
  "packages/policies",
  "packages/providers",
  "packages/shared",
]
include = ["proofstack_*"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --strict-config"
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
  "integration: exercises multiple application boundaries",
  "security: validates a security boundary",
  "contract: validates a stable public contract",
]

[tool.coverage.run]
branch = true
source = [
  "proofstack_api",
  "proofstack_worker",
  "proofstack_cli",
  "proofstack_core",
  "proofstack_analyzers",
  "proofstack_policies",
  "proofstack_providers",
  "proofstack_shared",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 75
exclude_also = [
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
  "@overload",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["apps", "packages", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "S", "ASYNC", "RUF"]
ignore = ["S101", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S105", "S106", "S108", "S603"]
"tests/conftest.py" = ["E402"]
"examples/**/*.py" = ["S105", "S106", "S602", "S603"]
"migrations/**/*.py" = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
plugins = ["pydantic.mypy"]
mypy_path = [
  "apps/api",
  "apps/worker",
  "apps/cli",
  "packages/core",
  "packages/analyzers",
  "packages/policies",
  "packages/providers",
  "packages/shared",
]
exclude = ["migrations", "examples/demo-python-service"]

[[tool.mypy.overrides]]
module = ["rq.*"]
ignore_missing_imports = true
