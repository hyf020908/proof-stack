name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "19 5 * * 1"

permissions:
  contents: read

jobs:
  boundaries:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: "3.11"
          cache: pip
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20.19.4
      - name: Enable the recorded pnpm release
        run: |
          corepack enable
          corepack prepare pnpm@10.18.3 --activate
      - name: Install audit tools and project
        run: |
          python -m pip install --editable '.[dev]'
          python -m pip install pip-audit==2.9.0
          pnpm install --frozen-lockfile
      - name: Validate repository and scan credential patterns
        run: python scripts/verify_repository.py
      - name: Run security regression tests
        run: python -m pytest tests/security
      - name: Audit Python dependencies
        run: python -m pip_audit --strict
      - name: Audit frontend dependencies
        run: pnpm audit --audit-level high
      - name: Lint Dockerfiles
        run: npx --yes dockerfilelint@1.8.0 docker/API.Dockerfile docker/Worker.Dockerfile docker/Web.Dockerfile
      - name: Run optional Semgrep rules
        continue-on-error: true
        run: |
          python -m pip install semgrep==1.150.0
          semgrep scan --config p/python --error apps packages
