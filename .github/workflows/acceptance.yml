name: Acceptance

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: acceptance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      PROOFSTACK_ENV: test
      PROOFSTACK_DEMO_MODE: "true"
      PROOFSTACK_TASK_BACKEND: inline
      PROOFSTACK_LLM_ENABLED: "false"
      PROOFSTACK_SEMGREP_ENABLED: "false"
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: "3.11"
          cache: pip
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20.19.4
      - name: Enable the recorded pnpm release
        run: |
          corepack enable
          corepack prepare pnpm@10.18.3 --activate
      - name: Bootstrap
        run: make bootstrap
      - name: Run acceptance without external services or paid APIs
        run: make acceptance
